version: '3.8'

services:
  e2e-tests:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    environment:
      - CI=true
      - VITE_SUPABASE_URL=http://localhost:54321
      - VITE_SUPABASE_ANON_KEY=test-anon-key
      - BASE_URL=http://web:5173
    ipc: host
    network_mode: host
    volumes:
      - ./playwright-report:/app/playwright-report
      - ./test-results:/app/test-results
